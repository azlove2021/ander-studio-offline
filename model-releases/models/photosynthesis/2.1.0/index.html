         <title id="scene-title">叶绿体内的光反应与卡尔文循环</title>
         <desc id="scene-desc">光反应在左侧类囊体薄膜进行，利用光和水形成氧、ATP及NADPH。右侧基质中的卡尔文循环利用ATP和NADPH固定二氧化碳并形成三碳糖，再生五碳化合物；ADP、无机磷酸和NADP正离子返回光反应。</desc>

         </defs>

          <text x="896" y="62" text-anchor="middle" class="organelle-title">叶绿体</text>

          <g id="nadp-record" class="carrier gold pale" transform="translate(804 604)"><rect width="173" height="48" rx="24"/><text x="86.5" y="33">NADP⁺</text></g>
         </g>
         <g class="reaction-group calvin-group">
          <text x="1322" y="225" text-anchor="middle" class="reaction-title">暗反应</text>
          <text x="1322" y="256" text-anchor="middle" class="reaction-location">叶绿体基质</text>

          <text x="1327" y="591" text-anchor="middle" class="cycle-step">C₅ 再生</text>
          <text x="1330" y="650" text-anchor="middle" class="small-label atp-note">也需 ATP</text>
          <path id="sugar-path" d="M1201 660V682Q1201 695 1214 695H1450" class="reaction-arrow"/>
          <text x="1327" y="724" text-anchor="middle" class="small-label">部分用于合成糖类</text>
          <g id="sugar-record" class="sugar molecule" transform="translate(1464 665)"><rect width="164" height="61" rx="17"/><text x="82" y="29" class="sugar-title">（CH₂O）</text><text x="82" y="50" class="sugar-sub">糖类</text></g>
          
         </g>

        </svg>
