<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>种间关系曲线变化</title><link rel="icon" href="data:,"><link rel="stylesheet" href="model.css?v=2.0.4"><link rel="stylesheet" href="shell-layout.css?v=2.0.4"><link rel="stylesheet" href="brand-watermark.css?v=2.0.4"><link rel="stylesheet" href="shell-standard.css?v=2.0.4"><link rel="stylesheet" href="window-standard.css?v=2.0.4"><script src="/assets/accounts/model-favorites.js?v=e9af20c54e036dd9573d4611bbb8bee47cccdad160e10e9d5ba98730656177d4"></script>
<script src="/assets/accounts/model-favorite-host.js?v=c616cfcae1d08ce04b9e0af0f0163800016def1b0a8a6c16f9bab30ff6e7b481" data-ander-model-host="website-v1" data-model-id="species-interactions"></script>
</head>
<body data-model-shell="adaptive-model-shell-2.5.0" data-model-version="2.0.4">
<main class="independent-model-app">
  <header class="independent-model-header"><a class="independent-model-back" href="#" aria-label="返回主页"></a><div class="independent-model-heading"><span class="independent-model-kicker"></span><h1></h1></div><button type="button" class="shell-icon-button" data-relationship-settings aria-label="显示与操作"></button></header>
  <div class="independent-model-workspace"><section class="model-area">
    <nav class="stage-strip" aria-label="种间关系观察阶段"></nav>
    <div class="model-stage"><div class="relationship-workbench">
      <div class="relationship-browser"><nav class="relationship-tabs" aria-label="选择对照关系"></nav><span data-relationship-mode>四图同步</span><button type="button" data-relationship-detail>单图细看</button><button type="button" data-relationship-context>情境 ↗</button></div><div class="science-viewport"><div class="plots-scroll"><div class="relationship-panels">
        <section class="relationship-panel" data-kind="predation">
          <h2>捕食 <span>Predation</span></h2><div class="plot-context">典型周期情境 · 3 个周期 · 猎物先达峰</div>
          <svg class="relationship-chart" id="predation-chart" role="img" aria-label="捕食关系的数量变化"></svg>
          <div class="series-legend"><button type="button" data-series="0" aria-pressed="true"><span class="line-key"></span>猎物 · 左轴 <output></output></button><button type="button" data-series="1" aria-pressed="true"><span class="line-key line-b"></span>捕食者 · 右轴 <output></output></button></div>
        </section>
        <section class="relationship-panel" data-kind="parasitism">
          <h2>寄生 <span>Parasitism</span></h2><div class="plot-context"><label><input id="reference-toggle" type="checkbox" checked><span class="reference-key"></span>灰虚线：未受寄生的宿主</label></div>
          <svg class="relationship-chart" id="parasitism-chart" role="img" aria-label="宿主与寄生者成体的数量变化及未受寄生的宿主对照"></svg>
          <div class="series-legend"><button type="button" data-series="0" aria-pressed="true"><span class="line-key"></span>宿主 · 左轴 <output></output></button><button type="button" data-series="1" aria-pressed="true"><span class="line-key line-b"></span>寄生者成体 · 右轴 <output></output></button></div>
        </section>
        <section class="relationship-panel" data-kind="competition">
          <h2>竞争 <span>Competition</span></h2><div class="plot-context"><select id="competition-mode" aria-label="竞争情境"><option value="periodic">周期共存 · 3 个周期</option><option value="exclusion">竞争排斥对照</option></select><span>资源条件周期变化</span></div>
          <svg class="relationship-chart" id="competition-chart" role="img" aria-label="周期资源条件下的竞争关系"></svg>
          <div class="series-legend"><button type="button" data-series="0" aria-pressed="true"><span class="line-key"></span>物种 A · 左轴 <output></output></button><button type="button" data-series="1" aria-pressed="true"><span class="line-key line-b"></span>物种 B · 右轴 <output></output></button></div>
        </section>
        <section class="relationship-panel" data-kind="mutualism">
          <h2>互利共生 / 原始合作</h2><div class="plot-context"><select id="mutualism-mode" aria-label="互利关系情境"><option value="obligate">互利共生 · 双方必需型</option><option value="facultative">原始合作 · 非必需型</option></select><label><input id="separate-toggle" type="checkbox">t = 18 解除关系</label></div>
          <svg class="relationship-chart" id="mutualism-chart" role="img" aria-label="共同环境一次波动中的互利关系数量变化"></svg>
          <div class="series-legend"><button type="button" data-series="0" aria-pressed="true"><span class="line-key"></span>物种 A · 左轴 <output></output></button><button type="button" data-series="1" aria-pressed="true"><span class="line-key line-b"></span>物种 B · 右轴 <output></output></button></div>
          <div class="mutual-caption" id="mutual-caption">共同环境变化 · 1 个周期</div>
        </section>
      </div></div><div class="science-note"><span>教学情境 · 非实测数据；周期波动不是种间关系的必然规律。</span><span>双纵轴分别读数，交点不表示数量相等。</span></div></div>
    </div></div>
    <div class="relationship-settings"><p>教学构造情境；周期波动不是种间关系的必然规律。蓝线读左轴、橙线读右轴，交点不代表数量相等。</p></div><footer class="control-dock"><div class="control-group control-group-primary"><button class="control-button is-primary" data-action="play" type="button">播放</button><button class="control-button" data-action="reset" type="button">重置</button><button class="control-button" data-action="prev" type="button">上一步</button><button class="control-button" data-action="next" type="button">下一步</button></div><div class="timeline-wrap"><div class="time-label"><label for="time-slider"><i>t</i> 时间</label><output id="time-value">0.0</output><span class="time-end">/ 36</span></div><input id="time-slider" aria-label="四图共同时间" type="range" min="0" max="10000" step="1" value="0"><span class="time-unit">示意时间 · 四图同步</span></div><span class="playback-state" id="playback-state">准备观察</span><div class="control-group control-group-view"><button class="control-button" data-action="speed" type="button">1×</button></div><button class="control-button" type="button" data-shell-tools></button><div class="control-group control-group-personal"><button class="control-button" type="button" data-shell-help></button><button class="control-button" type="button" data-shell-favorite></button><button class="control-button" data-action="fullscreen" type="button">全屏</button></div></footer>
  </section></div>
</main><div class="sr-only" id="announcement" aria-live="polite"></div>
<script src="shell-standard.js?v=2.0.4"></script><script type="module" src="model.js?v=2.0.4"></script><script type="module" src="brand-watermark.js"></script>
    <script src="/session.js?v=experience-r1"></script>
  </body></html>
