<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>种群的增长曲线</title><link rel="icon" href="data:,"><link rel="stylesheet" href="model.css"><link rel="stylesheet" href="ecology-layout.css"><link rel="stylesheet" href="brand-watermark.css"><link rel="stylesheet" href="shell-standard.css"><link rel="stylesheet" href="window-standard.css"><script src="/assets/accounts/model-favorites.js?v=e9af20c54e036dd9573d4611bbb8bee47cccdad160e10e9d5ba98730656177d4"></script>
<script src="/assets/accounts/model-favorite-host.js?v=c616cfcae1d08ce04b9e0af0f0163800016def1b0a8a6c16f9bab30ff6e7b481" data-ander-model-host="website-v1" data-model-id="population-growth"></script>
</head>
<body data-model-shell="adaptive-model-shell-2.5.1">
<main class="independent-model-app">
  <header class="independent-model-header"><a class="independent-model-back" href="#" aria-label="返回主页"></a><div class="independent-model-heading"><span class="independent-model-kicker"></span><h1></h1></div></header>
  <div class="independent-model-workspace"><section class="model-area">
    <nav class="stage-strip" aria-label="种群增长观察阶段"></nav>
    <div class="model-stage"><div class="population-workbench">
      <form class="parameter-form" id="parameters" novalidate>
        <label class="parameter-field">初始数量 <span>N₀</span><input id="initial-population" name="n0" type="number" inputmode="numeric" min="1" max="399" step="1" value="20" required aria-describedby="parameter-hint"><span class="unit">个</span></label>
        <label class="parameter-field">内禀增长率 <span>r</span><input id="intrinsic-rate" name="r" type="number" inputmode="decimal" min="0.05" max="2" step="0.05" value="0.6" required aria-describedby="parameter-hint"><span class="unit">年⁻¹</span></label>
        <button class="work-button" type="submit">应用并重置</button>
        <div class="science-time">
          <div class="time-label"><label for="time-slider"><i>t</i> 时间</label><output id="time-value">0 年</output><span class="time-end" id="time-end">/ 17 年</span></div>
          <input id="time-slider" type="range" min="0" max="10000" step="1" value="0" aria-label="时间 t，拖动同步观察 J 型与 S 型增长">
          <label class="tangent-option"><input id="tangent-toggle" type="checkbox">切线与速率</label>
        </div>
        <span class="parameter-k">K = 400 个（固定）</span>
        <span id="parameter-hint">1 ≤ N₀ &lt; K · 0.05 ≤ r ≤ 2</span>
        <span class="parameter-error" id="parameter-error" role="alert" hidden></span>
      </form>
      <div class="science-viewport">
        <div class="plots-scroll"><div class="growth-panels">
          <section class="growth-panel" data-kind="j" aria-label="J 型增长">
            <div class="plot-heading"><h2><span class="line-key"></span>J 型增长</h2><div class="plot-context"><span>理想条件 · 资源充足</span><span class="comparison-legend">S 型对比</span></div></div>
            <div class="scale-caption" id="j-scale">纵轴 0–500 · 每格 100 个</div>
            <svg class="growth-chart" id="j-chart" role="img" aria-label="J 型增长为蓝色实线，同一时刻的 S 型增长为浅灰虚线，纵轴在需要时自动扩大量程"></svg>
            <div class="growth-equation"><span>增长方程</span><math aria-label="dN 除以 dt 等于 rN"><mfrac><mrow><mi mathvariant="normal">d</mi><mi>N</mi></mrow><mrow><mi mathvariant="normal">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>r</mi><mi>N</mi></math></div>
            <div class="plot-state" id="j-state">相同初始种群数量</div>
            <dl class="growth-rates" id="j-rates" hidden><div><dt>瞬时增长速率 dN/dt</dt><dd id="j-speed"></dd></div><div><dt>瞬时相对增长率</dt><dd id="j-relative"></dd></div></dl>
          </section>
          <section class="growth-panel" data-kind="s" aria-label="S 型增长">
            <div class="plot-heading"><h2><span class="line-key"></span>S 型增长</h2><div class="plot-context"><span>环境有限 · K = 400 个</span><span class="comparison-legend">J 型对比</span></div></div>
            <div class="scale-caption">固定纵轴 0–500 · 每格 100 个</div>
            <svg class="growth-chart" id="s-chart" role="img" aria-label="S 型增长为绿色实线，同一时刻的 J 型增长为浅灰虚线，上界箭头表示 J 型继续增长并超出本图量程"></svg>
            <div class="growth-equation"><span>增长方程</span><math aria-label="dN 除以 dt 等于 rN 乘一减 N 除以 K"><mfrac><mrow><mi mathvariant="normal">d</mi><mi>N</mi></mrow><mrow><mi mathvariant="normal">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mi>r</mi><mi>N</mi><mo>(</mo><mn>1</mn><mo>−</mo><mfrac><mi>N</mi><mi>K</mi></mfrac><mo>)</mo></math></div>
            <div class="plot-state"><span id="s-state">初始数量低于 K/2</span><button class="work-button" type="button" id="jump-inflection">定位 K/2</button></div>
            <dl class="growth-rates" id="s-rates" hidden><div><dt>瞬时增长速率 dN/dt</dt><dd id="s-speed"></dd></div><div><dt>瞬时相对增长率</dt><dd id="s-relative"></dd></div></dl>
          </section>
        </div></div>
        <div class="science-note"><span id="axis-note">两图起始纵轴相同</span><span>K 固定 · 平缓段仍在缓慢趋近 K</span></div>
      </div>
    </div></div>
    <footer class="control-dock"><div class="control-group control-group-primary"><button class="control-button is-primary" data-action="play" type="button">播放</button><button class="control-button" data-action="reset" type="button">重置</button><button class="control-button" data-action="prev" type="button">上一步</button><button class="control-button" data-action="next" type="button">下一步</button></div><span class="playback-state" id="playback-state">准备观察</span><div class="control-group control-group-view"><button class="control-button" data-action="speed" type="button">1×</button><button class="control-button" data-action="fullscreen" type="button">全屏</button></div></footer>
  </section></div>
</main>
<div class="sr-only" id="announcement" aria-live="polite"></div>
<script src="shell-standard.js"></script><script type="module" src="model.js"></script><script type="module" src="brand-watermark.js"></script>
    <script src="/session.js?v=experience-r1"></script>
  </body></html>
