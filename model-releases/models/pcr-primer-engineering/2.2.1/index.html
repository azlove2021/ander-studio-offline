<body data-model-shell="adaptive-model-shell-2.5.1"><main class="independent-model-app">
<header class="independent-model-header"><a class="independent-model-back" href="#" aria-label="返回主页"></a><div class="independent-model-heading"><span class="independent-model-kicker"></span><h1></h1></div></header>
<div class="independent-model-workspace"><section class="model-area">
<nav class="stage-strip" aria-label="引物改造DNA的阶段"></nav>
<div class="model-stage"><div class="engineering-layout">
<aside class="primer-library" aria-label="选择两种PCR引物"><h2>选择引物</h2>
<button type="button" data-mode="restriction" aria-pressed="true"><strong>添加酶切位点</strong><svg id="restriction-primers" role="img" aria-label="两条引物的5端均携带额外识别序列"></svg><span>F + R · 5′端附加序列</span></button>
<button type="button" data-mode="mutation" aria-pressed="false"><strong>定点诱变</strong><svg id="mutation-primers" role="img" aria-label="一条突变正向引物和一条正常反向引物"></svg><span>突变 F + 正常 R</span></button>
<p>选择一组引物后，点击播放。</p></aside>
<section class="reaction-area" aria-label="DNA的三轮PCR反应">
<div class="reaction-heading"><div><h2 id="process-title">添加酶切位点</h2><span id="process-detail">5′附加序列 · 3′端正确配对</span></div><div class="phase-badge"><strong id="phase-name">引物定位</strong><span id="cycle-label">准备</span></div></div>
<div class="scene-viewport"><svg id="scene" role="img" aria-label="原始模板分离、引物退火与三轮分组同步延伸"></svg></div>
<div class="strand-legend"><span><i class="original"></i>初始母链</span><span><i class="new"></i>新生链</span><span><i class="primer"></i>引物区段</span><button type="button" id="jump-detail">位点放大</button></div>
<div class="reaction-progress"><strong>本轮反应</strong><div class="reaction-steps"><div data-phase="denature"><span><i></i></span><b>变性</b></div><div data-phase="anneal"><span><i></i></span><b>复性</b></div><div data-phase="extend"><span><i></i></span><b>延伸</b></div></div><output id="group-progress">准备</output></div>
<p class="observation-note">同类分组同步观察；实际反应液中的各组可并行合成。</p></section>
<aside class="site-detail" aria-label="正在反应的位点局部放大"><div class="detail-heading"><h2>位点局部放大</h2><button type="button" id="back-reaction">返回反应区</button></div><div id="site-label">EcoRI · 5′附加序列</div><div class="zoom-viewport"><svg id="site-zoom" role="img" aria-label="与主图同步的识别序列或错配碱基"></svg></div><div class="zoom-directions"><span>上链 5′ → 3′</span><span>下链 3′ ← 5′</span></div>
<p id="site-description" aria-live="polite"></p>
<section class="product-summary"><h2 id="counts-title">起始模板</h2><output id="total-count">1</output><span class="subtle">个 DNA 分子</span><div class="category-counts"><span>双长型 <b id="double-count">—</b></span><span>单长型 <b id="single-count">—</b></span><span>目标DNA <b id="exact-count">0</b></span></div></section>
<p id="phase-description"></p><p class="science-boundary">1个起始双链，理想扩增。示意序列；仅演示三轮。</p></aside>
</div></div>
